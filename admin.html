<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 Uluka Ultra — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: #050810; color: #c8d0e0; font-family: 'Rajdhani', sans-serif; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.15); padding-bottom: 12px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo .owl { font-size: 48px; filter: drop-shadow(0 0 12px rgba(240,180,41,0.3)); }
  .logo-text h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px; background: linear-gradient(135deg, #f0b429, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-text span { font-size: 12px; letter-spacing: 3px; color: #6a7a9a; display: block; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a9a5a; background: rgba(74,154,90,0.12); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(74,154,90,0.2); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a9a5a; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  #clock { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #f0b429; letter-spacing: 1px; }
  .section-title { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 16px; color: #ffd700; margin: 24px 0 12px 0; letter-spacing: 1px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 18px 16px; }
  .stat-card .stat-label { font-size: 12px; color: #6a7a9a; letter-spacing: 1px; }
  .stat-card .stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; margin: 6px 0 2px; color: #e0e8f0; }
  .stat-card .stat-value.gold { color: #ffd700; }
  .stat-card .stat-value.green { color: #4a9a5a; }
  .stat-card .stat-value.red { color: #d94a4a; }
  .stat-card .stat-sub { font-size: 11px; color: #4a5a7a; }
  .panel { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; min-height: 120px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width:700px){ .two-col{grid-template-columns:1fr;} }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  @media (max-width:900px){ .three-col{grid-template-columns:1fr 1fr;} }
  @media (max-width:500px){ .three-col{grid-template-columns:1fr;} }
  .client-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; flex-wrap: wrap; gap: 4px; }
  .client-row .name { color: #d0d8e8; font-weight: 500; }
  .client-row .val { color: #aab4c8; }
  .health-bar { background: rgba(255,255,255,0.06); border-radius: 4px; height: 6px; margin: 4px 0 8px; overflow: hidden; }
  .health-fill { height: 100%; border-radius: 4px; transition: width 0.6s; }
  .health-fill.good { background: #4a9a5a; }
  .health-fill.warn { background: #d4a24a; }
  .health-fill.danger { background: #d94a4a; }
  .trade-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
  .trade-item .profit { color: #4a9a5a; }
  .trade-item .loss { color: #d94a4a; }
  .billing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .billing-item { background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 6px; text-align: center; }
  .billing-item .label { font-size: 10px; color: #6a7a9a; }
  .billing-item .value { font-weight: 700; font-size: 16px; color: #d0d8e8; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 12px; color: #6a7a9a; font-size: 14px; padding: 20px 0; }
  .spinner { width: 20px; height: 20px; border: 2px solid rgba(240,180,41,0.15); border-top-color: #f0b429; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .error-msg { color: #d94a4a; padding: 12px; text-align: center; }
  .paye-highlight { color: #f0b429; font-weight: 700; }
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <img src="https://i.postimg.cc/g0p8Bm4N/photo-6255798421759397584-x.jpg?_=123456" 
     alt="Uluka Ultra" 
     style="height:48px; width:auto; border-radius:50%; filter:drop-shadow(0 0 12px rgba(240,180,41,0.3));">
    <div class="logo-text">
      <h1>ULUKA ULTRA</h1>
      <span>ADMIN INTELLIGENCE DASHBOARD</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>LIVE DATA</div>
    <div id="clock">--:--:--</div>
  </div>
</header>
<main>
  <div class="section-title">📊 Portfolio Overview</div>
  <div class="stat-grid" id="statGrid"><div class="loading"><div class="spinner"></div>Loading stats...</div></div>

  <div class="section-title">💰 Billing Summary (PAYE)</div>
  <div class="panel" id="billingSummary"><div class="loading"><div class="spinner"></div>Loading billing...</div></div>

  <div class="two-col">
    <div>
      <div class="section-title">👤 Active Clients</div>
      <div class="panel"><div id="clientTable"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
    <div>
      <div class="section-title">🩺 Account Health</div>
      <div class="panel"><div id="healthBars"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
  </div>
</main>
<script>
const RAILWAY_URL = 'https://uluka-backend-production.up.railway.app';
const ADMIN_SECRET = 'Sanica@7';

function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} GMT`;
}
setInterval(updateClock, 1000);
updateClock();

function fmtNum(n) {
  return Math.abs(parseFloat(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function healthColor(score) {
  if (score >= 80) return 'good';
  if (score >= 50) return 'warn';
  return 'danger';
}

async function fetchAdminData() {
  try {
    const res = await fetch(`${RAILWAY_URL}/api/admin/clients`, {
      headers: { 'x-admin-secret': ADMIN_SECRET }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const clients = await res.json();
    renderAll(clients);
  } catch (err) {
    document.querySelectorAll('.loading').forEach(el => el.innerHTML = `<span class="error-msg">❌ ${err.message}</span>`);
  }
}

function renderAll(clients) {
  let active = 0, totalProfit = 0, totalCut = 0, totalWinRate = 0, openPos = 0, tradesWeek = 0;
  let weeklyProfit = 0, weeklyPayee = 0, pendingPAYE = 0, totalEarned = 0;
  
  clients.forEach(c => {
    if (c.status === 'active') active++;
    const profit = parseFloat(c.profit || 0);
    const payee = parseFloat(c.payee_25 || 0);
    totalProfit += profit;
    totalCut += payee;
    totalWinRate += parseFloat(c.winRate || 0);
    openPos += parseInt(c.openPositions || 0);
    tradesWeek += parseInt(c.tradesThisWeek || 0);
    weeklyProfit += profit * 0.25; // rough weekly estimate
    weeklyPayee += payee;
    pendingPAYE += payee * 0.5; // placeholder – adjust as needed
    totalEarned += payee;
  });
  const avgWin = clients.length ? totalWinRate / clients.length : 0;
  const stats = {
    activeClients: active,
    totalNetProfit: totalProfit,
    yourCut: totalCut,
    avgWinRate: avgWin,
    tradesThisWeek: tradesWeek,
    openPositions: openPos,
    weeklyProfit: weeklyProfit,
    weeklyPayee: weeklyPayee,
    pendingPAYE: pendingPAYE,
    totalEarned: totalEarned
  };
  renderStats(stats);
  renderBilling(stats);
  renderClients(clients);
  renderHealth(clients);
}

function renderStats(s) {
  const profitClass = s.totalNetProfit >= 0 ? 'green' : 'red';
  const sign = s.totalNetProfit >= 0 ? '+' : '';
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Active Clients</div><div class="stat-value gold">${s.activeClients}</div><div class="stat-sub">Licensed accounts</div></div>
    <div class="stat-card"><div class="stat-label">Total Net Profit</div><div class="stat-value ${profitClass}">${sign}$${fmtNum(s.totalNetProfit)}</div><div class="stat-sub">All clients combined</div></div>
    <div class="stat-card"><div class="stat-label">Your 25% Cut</div><div class="stat-value gold">$${fmtNum(s.yourCut)}</div><div class="stat-sub">Lifetime earnings</div></div>
    <div class="stat-card"><div class="stat-label">Avg Win Rate</div><div class="stat-value">${s.avgWinRate.toFixed(1)}%</div><div class="stat-sub">Across all accounts</div></div>
    <div class="stat-card"><div class="stat-label">Trades This Week</div><div class="stat-value">${s.tradesThisWeek}</div><div class="stat-sub">Total volume</div></div>
    <div class="stat-card"><div class="stat-label">Open Positions</div><div class="stat-value" style="color:#4ac4d4;">${s.openPositions}</div><div class="stat-sub">Right now</div></div>
  `;
}

function renderBilling(s) {
  document.getElementById('billingSummary').innerHTML = `
    <div class="billing-grid">
      <div class="billing-item"><div class="label">Weekly Profit</div><div class="value">$${fmtNum(s.weeklyProfit)}</div></div>
      <div class="billing-item"><div class="label">Weekly 25% Cut</div><div class="value paye-highlight">$${fmtNum(s.weeklyPayee)}</div></div>
      <div class="billing-item"><div class="label">Pending PAYE</div><div class="value">$${fmtNum(s.pendingPAYE)}</div></div>
      <div class="billing-item"><div class="label">Total Earned</div><div class="value paye-highlight">$${fmtNum(s.totalEarned)}</div></div>
    </div>
  `;
}

function renderClients(clients) {
  let html = '';
  clients.forEach(c => {
    const profitClass = parseFloat(c.profit||0) >= 0 ? 'profit' : 'loss';
    const dd = parseFloat(c.dd) || 0;
    const payee = parseFloat(c.payee_25) || 0;
    html += `
      <div class="client-row">
        <span class="name">${c.name || c.account}</span>
        <span class="val">Bal: $${fmtNum(c.balance)} | P&L: <span style="color:${profitClass==='profit'?'#4a9a5a':'#d94a4a'}">$${fmtNum(c.profit)}</span> | PAYE: <span class="paye-highlight">$${fmtNum(payee)}</span> | DD: ${dd.toFixed(1)}%</span>
      </div>
    `;
  });
  document.getElementById('clientTable').innerHTML = html || '<div style="color:#6a7a9a;padding:12px;">No clients found.</div>';
}

function renderHealth(clients) {
  let html = '';
  clients.forEach(c => {
    const score = parseFloat(c.health) || 0;
    const color = healthColor(score);
    html += `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span>${c.name || c.account}</span>
          <span>${score.toFixed(0)}%</span>
        </div>
        <div class="health-bar"><div class="health-fill ${color}" style="width:${Math.min(score,100)}%;"></div></div>
      </div>
    `;
  });
  document.getElementById('healthBars').innerHTML = html || '<div style="color:#6a7a9a;padding:12px;">No health data.</div>';
}

fetchAdminData();
setInterval(fetchAdminData, 300000);
</script>
</body>
</html>
